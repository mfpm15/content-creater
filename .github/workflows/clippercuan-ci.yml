name: ClipperCuan - Tests

on:
  push:
    paths: ["clippercuan/**", ".github/workflows/clippercuan-ci.yml"]
  pull_request:
    paths: ["clippercuan/**", ".github/workflows/clippercuan-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clippercuan/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clippercuan/app/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements.txt pytest ruff
      - name: Lint (kesalahan nyata saja)
        run: ruff check clipper tests --select F,E9
      - name: Tests
        run: python -m pytest -q tests
