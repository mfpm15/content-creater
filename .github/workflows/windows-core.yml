name: Windows - Core setup and smoke

on:
  push:
    paths:
      - "creator-dashboard/**"
      - "clippercuan/app/requirements.txt"
      - "setup-core.bat"
      - "start-dashboard.bat"
      - ".github/workflows/windows-core.yml"
  pull_request:
    paths:
      - "creator-dashboard/**"
      - "setup-core.bat"
      - "start-dashboard.bat"
      - ".github/workflows/windows-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-core:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: work space/content-creater
    steps:
      - uses: actions/checkout@v4
        with:
          path: work space/content-creater
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install prerequisites
        shell: pwsh
        run: |
          python -m pip install uv
          if ($LASTEXITCODE -ne 0) { throw "uv install failed" }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg install failed" }
          }
          ffmpeg -version
          ffprobe -version
      - name: Run the real Windows core installer
        shell: cmd
        run: call setup-core.bat
      - name: Test planning, article documents and Windows paths
        shell: pwsh
        run: |
          $python = ".\creator-dashboard\.venv\Scripts\python.exe"
          & $python -c "import sys; sys.path.insert(0,'creator-dashboard'); import remotion_adapter; missing=remotion_adapter.runtime_issues(); assert not missing, missing"
          if ($LASTEXITCODE -ne 0) { throw "Remotion runtime missing; integration test must not skip in Windows CI" }
          $env:GSAP_TEST_SCRIPT = Join-Path $env:RUNNER_TEMP "gsap-3.13.0.min.js"
          Invoke-WebRequest "https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" -OutFile $env:GSAP_TEST_SCRIPT
          $env:THREE_TEST_SCRIPT = Join-Path $env:RUNNER_TEMP "three-0.160.0.min.js"
          Invoke-WebRequest "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js" -OutFile $env:THREE_TEST_SCRIPT
          foreach ($pattern in @("test_windows_runtime.py", "test_remaining_features.py", "test_video_drafter.py", "test_youtube_analytics.py", "test_video_bundle.py", "test_creative_profile.py", "test_continuous_motion.py", "test_animation_clock.py", "test_studio_controls.py", "test_production_automation.py", "test_opuscar_layout.py", "test_opuscar_directed.py", "test_scene_diagram.py", "test_three_scenes.py", "test_frame_rate.py", "test_video_preproduction.py", "test_speech_settings.py", "test_voice_quality.py", "test_video_templates.py", "test_media_library.py", "test_faceless_quality.py", "test_sound_effects.py", "test_renderer_contract.py")) {
            & $python -m unittest discover -s creator-dashboard -p $pattern
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $pattern" }
          }
          & $python creator-dashboard/test_dashboard.py
          if ($LASTEXITCODE -ne 0) { throw "Dashboard HTTP smoke failed" }
      - name: Check Remotion types and timeline safety
        shell: pwsh
        run: |
          Push-Location creator-dashboard/apps/video-studio-remotion
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw "Remotion typecheck failed" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Remotion timeline tests failed" }
          Pop-Location
      - name: Test the real Windows launcher from a path with spaces
        shell: pwsh
        run: |
          $env:CREATOR_DASHBOARD_NO_BROWSER = "1"
          $directory = (Get-Location).Path
          $stdout = Join-Path $env:RUNNER_TEMP "dashboard-launcher-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "dashboard-launcher-stderr.log"
          if (-not (Test-Path (Join-Path $directory "start-dashboard.bat"))) { throw "Launcher missing in working directory" }
          $process = Start-Process $env:ComSpec -WorkingDirectory $directory -ArgumentList "/d", "/c", "call start-dashboard.bat" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $failed = $false
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) { throw "Windows launcher exited early with code $($process.ExitCode)" }
              try {
                $response = Invoke-RestMethod http://127.0.0.1:3210/api/health -TimeoutSec 2
                if ($response.ok -and $response.service -eq "creator-dashboard") { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $ready) { throw "Windows launcher did not become ready" }
            $catalog = Invoke-RestMethod http://127.0.0.1:3210/api/tools -TimeoutSec 15
            if ($catalog.tools.Count -ne 9) { throw "Windows launcher returned an invalid tool catalog" }
          } catch {
            $failed = $true
            $details = ($_ | Out-String)
            foreach ($log in @($stdout, $stderr)) {
              if (Test-Path $log) { $details += (Get-Content $log -Tail 20 | Out-String) }
            }
            Write-Host $details
            $annotation = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows launcher startup failed::$annotation"
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              taskkill /PID $process.Id /T /F | Out-Null
              if ($LASTEXITCODE -ne 0) { Write-Warning "Launcher process exited during cleanup" }
            }
          }
          if ($failed) { exit 1 }
          exit 0
