<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class=side-head><a class=brand href=#/new aria-label=Clipper Cuan><span class=logo aria-hidden=true>C</span><span class=brand-copy><b>Clipper Cuan</b><small>Video workspace</small></span></a><button class=side-toggle id=sideToggle type=button aria-label=Ringkas sidebar aria-expanded=true><span aria-hidden=true>&lsaquo;</span></button></div>
  <nav aria-label="Area utama">
    <a href=#/new data-nav=new><i class="nav-icon nav-new" aria-hidden=true></i><span>Buat Klip</span></a>
    <a href=#/history data-nav=history><i class="nav-icon nav-projects" aria-hidden=true></i><span>Proyek</span><span class=badge id=runBadge hidden></span></a>
    <a href=#/results data-nav=results><i class="nav-icon nav-results" aria-hidden=true></i><span>Hasil</span></a>
    <a href=#/advanced data-nav=advanced><i class="nav-icon nav-studio" aria-hidden=true></i><span>Studio</span></a>
  </nav>
  <a class="secondary-nav" href=#/settings data-nav=settings><i class="nav-icon nav-settings" aria-hidden=true></i><span>Pengaturan</span></a>
  <div class=side-foot><div class=local-note><span class=status-dot></span><div><b>Service lokal</b><small id=sideFoot>Memuat sistem...</small></div></div></div>
</aside>

<main><div class=topbar><div class=topbar-context><div><p class=eyebrow id=pageContext>CLIPPER CUAN</p><strong id=pageTitle>Buat Klip</strong></div></div><div class=top-actions><div class=ai-health id=aiHealth role=status aria-live=polite><span class=status-dot></span><span>Memeriksa service...</span></div><a class=btn sm href=#/new>Buat Klip</a></div></div><div id=view aria-live=polite><section class=page><div class=loading-state><span class=spin></span><b>Menyiapkan workspace...</b></div></section></div></main>
<nav class="bottom-nav" aria-label="Navigasi utama seluler"><a href="#/new" data-mobile-nav="new"><i class="nav-icon nav-new" aria-hidden="true"></i><span>Buat Klip</span></a><a href="#/history" data-mobile-nav="history"><i class="nav-icon nav-projects" aria-hidden="true"></i><span>Proyek</span></a><a href="#/results" data-mobile-nav="results"><i class="nav-icon nav-results" aria-hidden="true"></i><span>Hasil</span></a><a href="#/advanced" data-mobile-nav="advanced"><i class="nav-icon nav-studio" aria-hidden="true"></i><span>Studio</span></a></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ================= TEMPLATES ================= -->
<template id="tpl-new">
  <section class="page new-project">
    <header class="page-h wizard-heading"><div><p class="eyebrow">WORKSPACE PRODUKSI</p><h1>Buat klip dari satu workspace</h1><p>Masukkan sumber. Pilihan berikutnya terbuka saat dibutuhkan.</p></div></header>
    <ol class="production-flow" id="productionFlow" aria-label="Tahap produksi"><li class="on" data-phase="source">Sumber</li><li data-phase="profile">Bahasa & profil</li><li data-phase="analysis">Analisis Video</li><li data-phase="candidates">Kandidat</li><li data-phase="style">Gaya</li><li data-phase="preview">Preview</li><li data-phase="render">Render</li></ol>
    <div class="production-workspace"><div class="wizard-content">

    <div class="card source-card">
      <div class="section-title"><span class="step-number">01</span><div><h2>Pilih sumber video</h2><p>Gunakan URL publik atau unggah file dari perangkat.</p></div></div>
      <div class="seg" id="srcTabs"><button class="on" data-src="link">Link video</button><button data-src="file">File lokal</button></div>
      <div id="srcLink" class="src-pane">
        <div class="url-row"><textarea id="url" class="in big" rows="2" placeholder="Tempel URL YouTube, TikTok, atau Instagram&#10;Satu URL per baris" autocomplete="off" spellcheck="false"></textarea><button class="btn big" type="button" id="startTop">Lanjut</button></div>
        <p class="hint" id="urlCount"></p>
        <div class="fx-row lite-row"><div><b>Hemat disk — jangan unduh video penuh</b><span>Momen terbaik dicari dari subtitle YouTube (tanpa unduh apa pun) atau dari audio saja. Yang diunduh hanya potongan klip terpilih, lalu langsung dihapus setelah dirender. Butuh internet saat render.</span><span class="lite-est" id="liteEst"></span></div><label class="sw"><input type="checkbox" id="storage_lite"><span></span></label></div>
      </div>
      <div id="srcFile" class="src-pane" hidden>
        <label class="drop" id="drop"><input type="file" id="file" accept="video/*" hidden>
          <b>Tarik &amp; lepas video di sini</b><span>atau klik untuk memilih (mp4, mov, mkv, webm) · file dipindah ke proyek, tidak diduplikasi</span><em id="fileName"></em>
          <div class="bar" hidden id="upBar"><i></i></div></label>
        <div class="url-row end"><button class="btn big" type="button" id="startTop2">Lanjut</button></div>
      </div>
    </div>

    <div class="card recipe-card progressive-panel" data-stage="style">
      <div class="section-title"><span class="step-number">02</span><div><h2>Pilih gaya produksi</h2><p>Empat rekomendasi utama berdasarkan analisis media. Detail caption, crop, safe zone, hook, dan dekorasi dapat ditinjau sebelum render.</p></div></div>
      <div class="recipe-grid" id="recipes"><span class="muted">Menganalisis rekomendasi…</span></div>
      <details class="experimental-recipes"><summary>Experimental / Legacy</summary><div class="recipe-grid" id="experimentalRecipes"></div></details>
    </div>
    <div class="card auto-card progressive-panel" data-stage="candidates">
      <div class="section-title"><span class="step-number">04</span><div><h2>Mode otomatis</h2><p>Setelah kandidat diranking, klip terbaik langsung dirender. Kandidat lain tetap bisa kamu pilih dan render nanti di Studio.</p></div><label class="sw"><input type="checkbox" id="auto_render"><span></span></label></div>
      <div class="pn-row"><span>Jumlah klip yang dibuat</span><div class="seg" id="clipCount"><button data-v="auto">Otomatis</button><button data-v="3">3</button><button data-v="5">5</button><button data-v="8">8</button><button data-v="10">10</button></div></div>
      <p class="hint" id="autoHint"></p>
      <div class="pn-row"><span>Kualitas hasil</span><div class="seg" id="qOut"><button data-v="1080">1080p · disarankan</button><button data-v="1440">1440p</button><button data-v="2160">4K</button></div></div>
      <div class="pn-row"><span>Resolusi sumber yang diunduh</span><div class="seg sm" id="qSrc"><button data-v="auto">Otomatis (terbaik)</button><button data-v="1080">1080p</button><button data-v="1440">1440p</button><button data-v="2160">4K</button></div></div>
      <p class="hint" id="qHint"></p>
    </div>
    <div class="card tpl-bar compact-card">
      <label class="inline">Template gaya <select id="tplSel" class="in"><option value="">— Pengaturan terakhir —</option></select></label>
      <button class="btn ghost sm" id="tplSave" type="button">Simpan sebagai template</button>
    </div>

    <div class="production-flow" hidden aria-hidden="true" data-workflow-contract="source-profile-candidates-compare-style-preview-render-review"></div>
    <div class="section-divider progressive-panel" data-stage="profile"><span class="step-number">03</span><div><h2>Pilih bahasa dan profil</h2><p>Profil backend mengatur scoring, durasi, crop, caption, hook, safe zone, dekorasi, dan kebijakan speaker.</p></div></div>
    <div class="card profile-card progressive-panel" data-stage="profile">
      <h3>Content profile</h3>
      <div class="preset-cards profile-presets" id="contentProfile">
        <button type="button" data-v="auto"><span class="status-pill production">Production</span><b>Auto</b><small>Deteksi profil, confidence, alasan, fallback General</small></button>
        <button type="button" data-v="general"><span class="status-pill production">Production</span><b>General</b><small>Clean Large, face-aware, aman untuk berbagai konten</small></button>
        <button type="button" data-v="podcast"><span class="status-pill production">Production</span><b>Podcast</b><small>Quote-aware dan speaker-aware</small></button>
        <button type="button" data-v="interview"><span class="status-pill production">Production</span><b>Interview</b><small>Tanya-jawab utuh dan active-speaker crop</small></button>
        <button type="button" data-v="review"><span class="status-pill production">Production</span><b>Review</b><small>Produk, perbandingan, dan verdict diprioritaskan</small></button>
        <button type="button" data-v="tech_review"><span class="status-pill production">Production</span><b>Tech Review</b><small>Demo, spesifikasi, produk, dan tangan terlindungi</small></button>
        <button type="button" data-v="gaming"><span class="status-pill production">Production</span><b>Gaming</b><small>Gameplay, facecam, dan HUD terlindungi</small></button>
        <button type="button" data-v="mobile_legends"><span class="status-pill production">Production</span><b>Mobile Legends</b><small>Objective, minimap, score, dan controls terlindungi</small></button>
        <button type="button" data-v="educational"><span class="status-pill production">Production</span><b>Educational</b><small>Keyword, learning outcome, dan ilustrasi ringan</small></button>
      </div>
      <p class="hint">Auto dapat dioverride. Sistem tidak membuat spesifikasi, harga, atau event game yang tidak didukung sumber.</p>
    </div>
    <div class="mode-switch progressive-panel" data-stage="analysis" id="uiMode" role="group" aria-label="Mode pengaturan"><button type="button" data-mode="basic" class="on">Dasar</button><button type="button" data-mode="advanced">Lanjutan</button><span>Analisis Video memakai pilihan ini untuk menyiapkan kandidat.</span></div>
    <div class="grid2 primary-settings progressive-panel" data-stage="analysis">
      <div class="card">
        <h3>Durasi & transkripsi</h3>
        <label>Preset durasi</label>
        <div class="preset-cards" id="durationPreset">
          <button type="button" data-v="auto"><b>Auto</b><small>Sesuai struktur ide</small></button>
          <button type="button" data-v="15-25"><b>15–25 dtk</b><small>Padat, payoff cepat</small></button>
          <button type="button" data-v="25-40"><b>25–40 dtk</b><small>Konteks sedang</small></button>
          <button type="button" data-v="40-60"><b>40–60 dtk</b><small>Penjelasan utuh</small></button>
        </div>
        <p class="estimate" id="durationEstimate">Estimasi Auto ditentukan setelah transkripsi berdasarkan hook, payoff, kepadatan ujaran, dan jeda.</p>
        <div class="row3">
          <label>Jumlah kandidat<input id="candidate_count" class="in" type="number" min="5" max="30"></label>
          <label>Durasi min (dtk)<input id="min_sec" class="in" type="number" min="5" max="180"></label>
          <label>Durasi maks (dtk)<input id="max_sec" class="in" type="number" min="10" max="300"></label>
        </div>
        <div class="row2">
          <label>Bahasa
            <select id="language" class="in">
              <option value="auto">Auto-detect</option><option value="id">Indonesia</option><option value="en">Inggris</option>
              <option value="ms">Melayu</option><option value="jw">Jawa</option><option value="su">Sunda</option><option value="ar">Arab</option>
              <option value="ja">Jepang</option><option value="ko">Korea</option><option value="zh">Mandarin</option><option value="es">Spanyol</option>
              <option value="hi">Hindi</option><option value="th">Thai</option><option value="vi">Vietnam</option>
              <option value="tl">Filipino / Tagalog</option><option value="pt">Portugis</option><option value="fr">Prancis</option><option value="de">Jerman</option><option value="it">Italia</option><option value="nl">Belanda</option><option value="tr">Turki</option><option value="ru">Rusia</option><option value="uk">Ukraina</option></select></label>
          <label>Kualitas transkripsi
            <select id="model" class="in">
              <option value="tiny">Tiny — tercepat</option><option value="base">Base — cepat</option>
              <option value="small">Small — seimbang (disarankan)</option><option value="medium">Medium — akurat, lambat</option>
              <option value="large-v3-turbo">Large v3 Turbo — hampir seakurat Large, jauh lebih cepat (GPU/RAM 8 GB+)</option><option value="large-v3">Large v3 — paling akurat, butuh RAM 16 GB</option></select></label>
        </div>
        <label>Sumber subtitle
          <select id="transcriber" class="in">
            <option value="auto">Otomatis — subtitle YouTube → API cloud → Whisper di laptop (disarankan)</option>
            <option value="youtube">Subtitle YouTube (tercepat, tanpa beban komputer)</option>
            <option value="api">API cloud (Groq/OpenAI/9router — atur di Pengaturan)</option>
            <option value="local">Whisper di laptop (offline, paling akurat untuk timing)</option></select></label>
        <label class="check"><input type="checkbox" id="translate_en"> Terjemahkan caption ke bahasa Inggris</label>
        <label class="check"><input type="checkbox" id="cut_silence"> Potong jeda hening otomatis (jump cut, lebih padat)</label>
        <div class="ai-choice" id="llmRow" hidden><label class="check"><input type="checkbox" id="use_llm" checked> Pilih momen & judul dengan AI</label><small>Model aktif: <b id="llmModel"></b></small></div>
        <div class="ai-choice fallback" id="localFallback"><span class="status-dot"></span><div><b>Seleksi lokal aktif</b><small>Highlight dipilih dengan analisis transkrip lokal. Tidak memakai 9Router.</small></div></div>
      </div>

      <div class="card">
        <h3>Format video</h3>
        <div class="layouts" id="layouts">
          <button data-l="portrait"><i class="ly ly-p"></i>Portrait 9:16</button>
          <button data-l="square"><i class="ly ly-s"></i>Square 1:1</button>
          <button data-l="blur"><i class="ly ly-b"></i>Blur background</button>
          <button data-l="split"><i class="ly ly-g"></i>Split gaming</button>
          <button data-l="landscape"><i class="ly ly-l"></i>Landscape 16:9</button>
        </div>
        <label class="check" id="smartRow"><input type="checkbox" id="smart_crop"> Smart crop: ikuti wajah pembicara</label>
        <div id="splitRow" hidden>
          <p class="hint">Posisi facecam di video asli:</p>
          <div class="chips" id="facePos"><button data-f="tl">Kiri atas</button><button data-f="tr">Kanan atas</button><button data-f="bl">Kiri bawah</button><button data-f="br">Kanan bawah</button></div>
          <label>Ukuran facecam di video asli <input type="range" id="faceSize" min="15" max="50" value="30"></label>
          <label>Porsi facecam di hasil <input type="range" id="faceRatio" min="25" max="55" value="40"></label>
        </div>
      </div>
    </div>

    <details class="advanced advanced-only" open><summary><span><b>03 · Subtitle & identitas</b><small>Caption, judul, dan watermark</small></span><em>Atur</em></summary><div class="advanced-body grid2">
      <div class="card" id="capCard">
        <h3>Caption <label class="sw"><input type="checkbox" id="cap_enabled"><span></span></label></h3>
        <div class="chips" id="capStyle"><button data-v="clean">Plain</button><button data-v="karaoke">Karaoke</button><button data-v="wbw">Word by word</button><button data-v="keyword">Subtract &amp; font</button></div>
        <div class="pn-row"><label class="check"><input type="checkbox" id="cap_box"> Box highlight (kotak ikut kata aktif)</label><label class="check"><input type="checkbox" id="cap_glow"> Efek glow</label></div>
        <div class="row2">
          <label>Font<select id="cap_font" class="in"></select></label>
          <label>Posisi<select id="cap_position" class="in"><option value="bottom">Bawah</option><option value="middle">Tengah</option><option value="top">Atas</option></select></label>
        </div>
        <div class="row3">
          <label>Warna teks<input type="color" id="cap_color" class="in color"></label>
          <label>Warna sorotan<input type="color" id="cap_highlight" class="in color"></label>
          <label>Kata per baris<input type="number" id="cap_wpl" class="in" min="1" max="8"></label>
        </div>
        <label>Ukuran <input type="range" id="cap_size" min="50" max="130"></label>
        <label class="check"><input type="checkbox" id="cap_upper"> HURUF BESAR</label>
        <label class="check"><input type="checkbox" id="cap_pop"> Animasi pop</label>
        <div class="preview" id="capPreview"><span class="pv-w">Ini</span> <span class="pv-w on">momen</span> <span class="pv-w">penting</span></div>
      </div>

      <div class="card">
        <h3>Judul pembuka <label class="sw"><input type="checkbox" id="ttl_enabled"><span></span></label></h3>
        <div class="chips" id="ttlPreset"><button data-v="duo">Duo glow</button><button data-v="bar">Bar</button><button data-v="outline">Outline</button><button data-v="neon">Neon</button><button data-v="clean">Clean</button></div>
        <label>Tampil selama (detik, 0 = sepanjang klip)<input type="number" id="ttl_duration" class="in" min="0" max="120"></label>
        <h3 class="mt">Watermark <label class="sw"><input type="checkbox" id="wm_enabled"><span></span></label></h3>
        <div class="row2">
          <label>Teks<input id="wm_text" class="in" maxlength="40"></label>
          <label>Logo PNG (opsional)<span class="inrow"><label class="btn ghost sm upbtn">＋ Pilih logo<input type="file" id="wm_file" accept="image/png,image/jpeg,image/webp" hidden></label><span class="muted ell" id="wmName">belum ada</span></span></label>
        </div>
        <div class="chips" id="wmPos"><button data-v="tl">↖</button><button data-v="tr">↗</button><button data-v="c">●</button><button data-v="bl">↙</button><button data-v="br">↘</button></div>
        <label>Transparansi <input type="range" id="wm_opacity" min="20" max="100"></label>
      </div>
    </div></details>

    <details class="advanced advanced-only"><summary><span><b>04 · Dekorasi & audio</b><small>Opt-in, maksimal satu dekorasi aktif, safe-zone guarded</small></span><em>Opsional</em></summary><div class="advanced-body grid2">
      <div class="card">
        <h3>Efek visual</h3>
        <fieldset class="decoration-choice"><legend>Dekorasi</legend><label><input type="radio" name="decoration_mode" value="none" checked> Tanpa dekorasi</label><label><input type="radio" name="decoration_mode" value="smart_emoji"> Emoji cerdas</label><label><input type="radio" name="decoration_mode" value="light_illustration"> Ilustrasi ringan</label></fieldset>
        <p class="hint">Berbasis keyword, saran LLM, atau manual. Otomatis dibatalkan bila wajah, produk, HUD, atau caption tidak menyisakan area aman.</p>
        <div class="fx-row"><div><b>Emoji cerdas</b><span>Muncul singkat hanya untuk event semantik relevan</span></div><label class="sw"><input type="checkbox" id="emoji_on" aria-label="Aktifkan emoji cerdas"><span></span></label></div>
        <label id="emojiSizeRow">Ukuran emoji <input type="range" id="emoji_size" min="60" max="160"></label>
        <div class="fx-row"><div><b>Progress bar</b><span>Garis tipis yang berjalan, bikin penonton bertahan sampai akhir</span></div><label class="sw"><input type="checkbox" id="pb_on"><span></span></label></div>
        <div class="row2" id="pbRow"><label>Warna<input type="color" id="pb_color" class="in color"></label><label>Posisi<select id="pb_pos" class="in"><option value="bottom">Bawah</option><option value="top">Atas</option></select></label></div>
        <div class="fx-row"><div><b>Ajakan di akhir (CTA)</b><span>Teks penutup, mis. "Follow untuk part 2"</span></div><label class="sw"><input type="checkbox" id="cta_on"><span></span></label></div>
        <div class="row2" id="ctaRow"><label>Teks<input id="cta_text" class="in" maxlength="50"></label><label>Durasi (dtk)<input id="cta_dur" type="number" class="in" min="1" max="10"></label></div>
      </div>
      <div class="card">
        <h3>Musik latar <label class="sw"><input type="checkbox" id="mu_on"><span></span></label></h3>
        <p class="hint">Volume musik turun otomatis saat ada suara (ducking). Pakai musik bebas royalti / milikmu sendiri.</p>
        <div id="muBody">
          <div class="inrow"><select id="mu_file" class="in"></select><label class="btn ghost sm upbtn">＋ Unggah<input type="file" id="mu_up" accept="audio/*" hidden></label></div>
          <audio id="mu_prev" controls preload="none" class="mu-prev"></audio>
          <label>Volume musik <input type="range" id="mu_vol" min="3" max="60"></label>
          <label class="check"><input type="checkbox" id="mu_duck"> Ducking otomatis (disarankan)</label>
        </div>
      </div>
    </div></details>

    <div class="go sticky-action contextual-render-bar progressive-panel" data-stage="render"><div><b>Siap membuat kandidat?</b><span class="hint" id="startHint">Sistem mengunduh, membuat subtitle, lalu meranking kandidat.</span></div><button class="btn big" id="start"><span>Buat Kandidat</span><small>Belum merender video</small></button></div>
    </div></div>
  </section>
</template>

<dialog id="dlg"><form method="dialog"><button class="x" aria-label="Tutup"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></form><div id="dlgBody"></div></dialog>
<script src="app.js"></script>
<script src="studio.js"></script>
</body>
</html>
